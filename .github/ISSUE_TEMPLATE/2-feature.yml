name: Feature request
description: Something Walrus Console can't do yet.
title: "[Feature]: "
labels: ["console new feature", "P2"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of the new feature and what the benefit would be. Paste, drop, or click to add files.
    validations:
      required: true
  - type: dropdown
    id: workaround
    attributes:
      label: Is there a workaround today?
      options:
        - "Yes"
        - "No"
    validations:
      required: true
  - type: checkboxes
    id: code-of-conduct
    attributes:
      label: Code of Conduct
      description: By submitting this issue, you agree to follow our [Code of Conduct](https://github.com/MystenLabs/walrus/blob/main/CODE_OF_CONDUCT.md).
      options:
        - label: I agree to follow this project's Code of Conduct.
          required: true
